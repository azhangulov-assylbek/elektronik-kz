{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Вход" %} — elektronik.kz{% endblock %}
{% block content %}
    <h1>{% trans "Вход" %}</h1>
    <div class="card" style="max-width:400px;">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">{% trans "Войти" %}</button>
        </form>
        <p style="margin-top:12px;">{% trans "Нет аккаунта?" %} <a href="{% url 'accounts:register' %}">{% trans "Зарегистрироваться" %}</a></p>
    </div>
{% endblock %}
