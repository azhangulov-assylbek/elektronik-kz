services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elektronik}
      POSTGRES_USER: ${POSTGRES_USER:-elektronik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elektronik}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elektronik}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    # Docker — только прод-конфигурация (config.settings.prod, PostgreSQL).
    # Локальная разработка запускается на хосте без Docker, на
    # config.settings.development (SQLite) — см. manage.py.
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000 --insecure"
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-elektronik}
      POSTGRES_USER: ${POSTGRES_USER:-elektronik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elektronik}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media:
