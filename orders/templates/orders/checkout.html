{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Оформление заказа" %} — elektronik.kz{% endblock %}
{% block content %}
    <h1>{% trans "Оформление заказа" %}</h1>
    <div class="card" style="max-width:500px;">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <p style="font-weight:bold;">{% trans "Итого" %}: {{ cart.total_price }} ₸</p>
            <button type="submit" class="btn">{% trans "Подтвердить заказ" %}</button>
        </form>
    </div>
{% endblock %}
